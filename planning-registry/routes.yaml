# Chains that recur, as control structure rather than prose.
#
# These are route templates, not a universal workflow. Enter the phase whose
# input is missing; repeat only phases whose decisions a new finding invalidates.
# A pre-execution repair is not post-start replanning.

full-plan:
  pattern: linear
  when: "multi-week or hard to reverse, nothing decided yet"
  chain: [planning-frame, planning-discover, planning-options, planning-decompose, planning-estimate, planning-risk, planning-review]
  gate: "the goal fits in one sentence without 'and' before anything else runs"

approach:
  pattern: linear
  when: "the problem is clear, the way to solve it is not"
  chain: [planning-discover, planning-options]
  gate: "a load-bearing assumption is verified before an approach is chosen"

breakdown:
  pattern: linear
  when: "the approach is decided and the work needs shape"
  chain: [planning-decompose, planning-estimate]

state-the-problem:
  pattern: report-only
  when: "nobody can say in one sentence what this is for"
  chain: [planning-frame]
  stops_at: "goals, non-goals, measurable criteria, and the open questions. No approach is chosen"

find-out:
  pattern: report-only
  when: "what is actually true here"
  chain: [planning-discover]
  stops_at: "verified facts with pointers, falsified assumptions, and unknowns ranked by decision impact"

what-could-go-wrong:
  pattern: linear
  when: "the plan exists and nobody has stress-tested it"
  chain: [planning-risk, planning-review]

course-correct:
  pattern: linear
  when: "work started and reality diverged"
  chain: [planning-replan]
  gate: "work has started; classify the divergence before choosing its correction surface"
  reenter:
    estimate: planning-estimate
    dependency: planning-decompose
    approach: planning-options
    evidence: planning-discover
    goal: planning-frame
    constraint: planning-frame  # agreed brief changes; a capacity-only delta is estimate
    materialized-risk: planning-risk
    record-only: none
    stop: none

review-to-ready:
  pattern: loop
  when: "close every blocking finding before work starts"
  chain: [planning-review]
  repair:
    goal: planning-frame
    evidence: planning-discover
    decision: planning-options
    dependency: planning-decompose
    estimate: planning-estimate
    risk: planning-risk
  oracle: "repair each blocking finding at its owner, check affected decisions, then review again; no blocking finding remains and one pass adds none"
  checker: other-engine          # resolved at run time to one that is not running this
  max_cycles: 3
