name: check

on:
  pull_request:
  push:
    branches: [main]
  # The seeded model takes about a minute, so it does not belong on every push.
  # It is also the only thing that catches a stale or tampered fixture, so it
  # cannot be left to someone remembering.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Static rules
        run: python3 planning-tools/validate.py
      - name: Every rule still fires
        run: make test
      - name: Delivered blocks are current
        run: |
          python3 planning-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }

  model:
    name: Seeded model
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The fixture still agrees with the model
        run: python3 planning-tools/figures_check.py --full
